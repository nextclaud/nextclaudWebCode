name: Deploy UK marketing site to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'uk-website/**'
      - '.github/workflows/uk_website-nextclaud.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy www.nextclaud.co.uk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy UK static site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UK }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: uk-website
          api_location: ''
          output_location: ''
          skip_app_build: true
